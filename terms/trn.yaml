name: Target Reference Number
aliases: [TRN, Tag, Target Coordinate, Target ID]
definition: |
    A Target Reference Number (TRN), also known as a target coordinate, target id or tag, is a randomly assigned numeric or alphanumeric code used to represent a remote viewing target while keeping its identity hidden. This prevents the viewer from being influenced by preconceived ideas. Originally, real-world coordinates were used, but modern TRNs are random to maintain target blindness.

    Typically consisting of two sets of four digits (e.g., 3456/8921), a TRN provides a neutral reference point for tasking. While not essential, it helps structure remote viewing sessions and allows for easier tracking of targets.
